[project]
name = "uag"
version = "0.1.0"
description = "Universal Agent Graph — multi-model orchestration with intelligent merge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0",
  "anthropic>=0.25",
  "typer>=0.12",
  "rich>=13.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "httpx>=0.27"]

[project.scripts]
uag = "uag.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["uag*"]
